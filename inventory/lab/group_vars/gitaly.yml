---
# Team convention: attach the dedicated EBS data volume as /dev/sdb in AWS.
gitaly_data_attachment_name: /dev/sdf

common_service_ports:
  - "{{ gitaly_tls_port if (cluster_rpc_tls_enabled | bool) else gitaly_plaintext_port }}"

# The Rails application is not set up yet. Enable this and provide the API URL
# and GitLab Shell secret after the application is deployed.
gitaly_configure_gitlab_callbacks: true
gitaly_internal_api_url: 'https://gitlab.tyagi.fun/api/v4/internal'
