---
common_service_ports:
  - "{{ praefect_tls_port if (cluster_rpc_tls_enabled | bool) else praefect_plaintext_port }}"

praefect_default_replication_factor: 2

# Shared TLS identity used by clients through the TCP passthrough NLB.
# Existing certificates require explicit reissuance; bootstrap preserves them.
tls_extra_dns_names:
  - "{{ praefect_external_hostname }}"
