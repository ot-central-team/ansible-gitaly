ansible_user: ubuntu
ansible_become: true
gitlab_ee_version: "19.4.1-ee.0"
cluster_cidr: 0.0.0.0/0
ssh_sources:
  - "{{ cluster_cidr }}"

# Shared CA configuration. The CA key stays on the bastion.
tls_ca_common_name: "Repo Data Internal TLS CA"
tls_ca_directory: /etc/ansible/pki/repo-data
tls_ca_privatekey_path: "{{ tls_ca_directory }}/ca.key"
tls_ca_certificate_path: "{{ tls_ca_directory }}/ca.crt"
tls_ca_csr_path: "{{ tls_ca_directory }}/ca.csr"
tls_ca_validity_days: 3650

# One switch for BOTH Gitaly and Praefect RPC listeners and backend connections.
# Database TLS is independent and remains enabled.
cluster_rpc_tls_enabled: false
gitaly_plaintext_port: 8075
gitaly_tls_port: 9999
praefect_plaintext_port: 2305
praefect_tls_port: 3305

# Client-facing TCP passthrough NLB DNS name; also added to Praefect SANs.
praefect_external_hostname: nlb.tyagi.fun
