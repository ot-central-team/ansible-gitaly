# POC only: dedicated haproxy-1 VM. No TLS termination, HTTP, or PROXY protocol.
global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 600 level admin

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend praefect_entry
    bind :443
    default_backend praefect

backend praefect
    balance leastconn
    # Private IPs assigned in the README. Update if your addresses differ.
    # TCP checks detect a listener, NOT DB/replication/application health.
    server p1 10.70.0.10:3305 check inter 3s fall 3 rise 2
    server p2 10.70.1.10:3305 check inter 3s fall 3 rise 2
    server p3 10.70.2.10:3305 check inter 3s fall 3 rise 2
