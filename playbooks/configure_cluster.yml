---
- name: Validate the shared RPC transport before changing any host
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tags: [always]
  tasks:
    - name: Require one boolean mode and reject obsolete independent switches
      ansible.builtin.assert:
        that:
          - cluster_rpc_tls_enabled is defined
          - cluster_rpc_tls_enabled is boolean
          - gitaly_enable_tls is not defined
          - praefect_enable_tls is not defined
          - hostvars[item].cluster_rpc_tls_enabled == cluster_rpc_tls_enabled
        fail_msg: >-
          Set cluster_rpc_tls_enabled to true or false in group_vars/all.
          Remove gitaly_enable_tls/praefect_enable_tls and any conflicting host/group
          overrides. Both RPC services must use the same mode, including the bastion.
      loop: "{{ groups['all'] }}"

- name: 1. Prepare VM packages and firewall
  hosts: gitaly:praefect
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
  - common
  tags:
  - common
- name: 2. Prepare and mount each Gitaly repository volume
  hosts: gitaly
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
  - name: Run the Gitaly storage tasks
    ansible.builtin.import_role:
      name: gitaly
      tasks_from: attach_storage.yml
  tags:
  - storage
- name: 3. Install the agreed GitLab package on Gitaly and Praefect VMs
  hosts: gitaly:praefect
  become: true
  serial: 1
  any_errors_fatal: true
  gather_facts: true
  roles:
  - installation
  tags:
  - installation
- name: 4. Prepare the Praefect database from the bastion
  hosts: bastion
  gather_facts: true
  become: true
  any_errors_fatal: true
  roles:
  - db
  tags:
  - database
- name: 5. Create or verify the internal TLS CA on the bastion
  hosts: bastion
  become: true
  gather_facts: true
  tasks:
  - name: Run the selected TLS tasks
    ansible.builtin.import_role:
      name: tls
      tasks_from: ca_generation.yml
    when: cluster_rpc_tls_enabled | bool
  any_errors_fatal: true
  tags:
  - ca
- name: 6. Issue and distribute node certificates
  hosts: gitaly:praefect
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  tasks:
  - name: Run the selected TLS tasks
    ansible.builtin.import_role:
      name: tls
      tasks_from: distribution_tls.yml
    when: cluster_rpc_tls_enabled | bool
  tags:
  - certificates
- name: 7. Configure Gitaly nodes separately from their data disks
  hosts: gitaly
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
  - name: Run the Gitaly configuration tasks
    ansible.builtin.import_role:
      name: gitaly
      tasks_from: configuration.yml
  tags:
  - gitaly
- name: 8. Configure Praefect nodes without migrating the database
  hosts: praefect
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
  - praefect
  tags:
  - praefect
- name: 9. Print manual migration and verification commands
  hosts: praefect
  gather_facts: false
  become: false
  tags:
  - next_steps
  tasks:
  - name: Show remaining manual steps on one Praefect VM
    ansible.builtin.debug:
      msg:
      - Configuration completed; database migration and health checks have NOT been run.
      - Run the migration once on ONE configured Praefect VM, for example {{ inventory_hostname }}. Do not run it
        concurrently on multiple nodes.
      - sudo -u git -- /opt/gitlab/embedded/bin/praefect -config /var/opt/gitlab/praefect/config.toml sql-migrate
      - sudo -u git -- /opt/gitlab/embedded/bin/praefect -config /var/opt/gitlab/praefect/config.toml sql-migrate-status
      - 'After migration, run this on each Praefect VM: sudo gitlab-ctl praefect check'
      - A successful configuration run is not a completed cluster health check.
    run_once: true
