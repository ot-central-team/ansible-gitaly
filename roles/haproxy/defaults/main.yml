---
haproxy_public_hostname: 'haproxy.tyagi.fun'
# Existing combined PEM (public full chain + matching private key) ON THE BASTION.
haproxy_public_pem_source: /etc/ansible/pki/haproxy/public.pem
haproxy_internal_ca_source: "{{ tls_ca_certificate_path }}"
haproxy_allowed_client_sources: []
haproxy_frontend_port: 443
haproxy_praefect_port: 3305
haproxy_backend_hosts: "{{ groups['praefect'] | default([]) }}"
