---
- name: Require Ubuntu and an exact GitLab EE package version
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - gitlab_ee_version is match('^[0-9]+\.[0-9]+\.[0-9]+-ee\.0$')
    fail_msg: Set gitlab_ee_version to an available exact package version, such as 19.4.1-ee.0.

- name: Refresh apt cache and install GitLab package prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - openssh-server
      - tzdata
      - perl
      - openssl
    state: present
    update_cache: true

- name: Check whether the GitLab EE apt repository is already configured
  ansible.builtin.stat:
    path: "{{ gitlab_package_repo_file }}"
  register: gitlab_package_repo_file_stat

- name: Download GitLab's official repository setup script
  ansible.builtin.get_url:
    url: "{{ gitlab_package_repo_script_url }}"
    dest: "{{ gitlab_package_repo_script_path }}"
    mode: '0755'
  when: not gitlab_package_repo_file_stat.stat.exists

- name: Configure the GitLab EE apt repository
  ansible.builtin.command:
    argv:
      - bash
      - "{{ gitlab_package_repo_script_path }}"
    creates: "{{ gitlab_package_repo_file }}"
  when: not gitlab_package_repo_file_stat.stat.exists

- name: Remove the downloaded repository setup script
  ansible.builtin.file:
    path: "{{ gitlab_package_repo_script_path }}"
    state: absent

- name: Refresh apt metadata after adding the GitLab repository
  ansible.builtin.apt:
    update_cache: true

- name: Create GitLab configuration directory
  ansible.builtin.file:
    path: /etc/gitlab
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Prevent automatic all-in-one reconfiguration during package installation
  ansible.builtin.file:
    path: /etc/gitlab/skip-auto-reconfigure
    state: touch
    owner: root
    group: root
    mode: '0644'

- name: Install the exact agreed GitLab EE version
  ansible.builtin.apt:
    name: "{{ gitlab_package_name }}={{ gitlab_ee_version }}"
    state: present
    update_cache: true

- name: Hold GitLab package version until a planned upgrade
  ansible.builtin.dpkg_selections:
    name: "{{ gitlab_package_name }}"
    selection: hold
