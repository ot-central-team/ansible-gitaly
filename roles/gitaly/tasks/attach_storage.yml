---
- name: Find the current device path for this EBS volume ID
  ansible.builtin.shell: >-
    lsblk -dn -o NAME,SERIAL |
    awk -v serial='{{ gitaly_data_ebs_volume_id | regex_replace("-", "") }}'
    '$2 == serial { print "/dev/" $1 }'
  args:
    executable: /bin/bash
  register: gitaly_data_device_lookup
  changed_when: false

- name: Confirm exactly one attached disk matches the supplied EBS volume ID
  ansible.builtin.assert:
    that:
      - gitaly_data_device_lookup.stdout_lines | length == 1
    fail_msg: "Could not find exactly one attached disk for {{ gitaly_data_ebs_volume_id }}."

- name: Create ext4 filesystem on this host's data volume
  community.general.filesystem:
    dev: "{{ gitaly_data_device_lookup.stdout }}"
    fstype: "{{ gitaly_data_filesystem }}"
    force: false
  when: gitaly_format_data_disk | bool

- name: Read the filesystem UUID
  ansible.builtin.command:
    argv:
      - blkid
      - -o
      - value
      - -s
      - UUID
      - "{{ gitaly_data_device_lookup.stdout }}"
  register: gitaly_data_uuid_result
  changed_when: false

- name: Create the repository data mountpoint
  ansible.builtin.file:
    path: "{{ gitaly_data_mountpoint }}"
    state: directory
    mode: '0755'

- name: Mount the repository volume by UUID and persist it in fstab
  ansible.posix.mount:
    src: "UUID={{ gitaly_data_uuid_result.stdout | trim }}"
    path: "{{ gitaly_data_mountpoint }}"
    fstype: "{{ gitaly_data_filesystem }}"
    opts: defaults
    dump: '0'
    passno: '2'
    state: mounted

- name: Reload systemd mount units after fstab update
  ansible.builtin.systemd_service:
    daemon_reload: true
