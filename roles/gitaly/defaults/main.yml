---
# Use this AWS attachment name for the data volume on every Gitaly VM.
gitaly_data_attachment_name: /dev/sdf
gitaly_format_data_disk: false
gitaly_data_filesystem: ext4
gitaly_data_mountpoint: /var/opt/gitlab/git-data

# Gitaly service configuration defaults.
gitaly_config_path: /etc/gitlab/gitlab.rb
# Shared switch for BOTH RPC services; set once in group_vars/all.
cluster_rpc_tls_enabled: false
gitaly_plaintext_port: 8075
gitaly_tls_port: 9999
gitaly_listen_address: "0.0.0.0:{{ gitaly_plaintext_port }}"
gitaly_tls_listen_address: "0.0.0.0:{{ gitaly_tls_port }}"
gitaly_tls_certificate_path: /etc/gitlab/ssl/server.crt
gitaly_tls_privatekey_path: /etc/gitlab/ssl/server.key
# System bundle includes public CAs and our internal CA installed by the TLS role.
gitaly_ca_certificate_path: /etc/ssl/certs/ca-certificates.crt
gitaly_repository_mountpoint: /var/opt/gitlab/git-data
gitaly_repository_path: /var/opt/gitlab/git-data/repositories
gitaly_configure_gitlab_callbacks: true
gitaly_internal_api_url: ''
gitaly_reconfigure_on_change: true

# Override these with vaulted/shared inventory values.
praefect_internal_token: ''
gitaly_gitlab_secret_token: ''
