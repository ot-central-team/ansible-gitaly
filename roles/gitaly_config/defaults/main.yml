---
gitaly_config_path: /etc/gitlab/gitlab.rb
gitaly_tls_listen_address: '0.0.0.0:9999'
gitaly_tls_certificate_path: /etc/gitlab/ssl/server.crt
gitaly_tls_privatekey_path: /etc/gitlab/ssl/server.key
gitaly_repository_mountpoint: /var/opt/gitlab/git-data
gitaly_repository_path: /var/opt/gitlab/git-data/repositories
gitaly_configure_gitlab_callbacks: true
gitaly_internal_api_url: ''
gitaly_reconfigure_on_change: true

# Override these with vaulted/shared inventory values.
praefect_internal_token: ''
gitaly_gitlab_secret_token: ''
