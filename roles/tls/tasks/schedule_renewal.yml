---
# Controller-only timer setup; both systemd units are defined in this file.
- name: Validate scheduler paths and identity
  ansible.builtin.assert:
    that:
    - tls_renew_schedule_user is match('^[a-z_][a-z0-9_-]*$')
    - (playbook_dir | dirname) is match('^/[A-Za-z0-9_./-]+$')
    - ((ansible_playbook_python | dirname) ~ '/ansible-playbook') is match('^/[A-Za-z0-9_./-]+$')
    - tls_renew_schedule_vault_password_file is match('^/[A-Za-z0-9_./-]+$')
    fail_msg: Set absolute paths without spaces and a controller user. Unattended renewal currently supports Praefect
      with NLB draining only.
- name: Inspect required scheduler inputs
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
  - '{{ (playbook_dir | dirname) }}/playbooks/renew_tls.yml'
  - "{{ ((ansible_playbook_python | dirname) ~ '/ansible-playbook') }}"
  - '{{ tls_renew_schedule_vault_password_file }}'
  register: tls_schedule_files
- name: Require files and a private Vault password file owned by the scheduler user
  ansible.builtin.assert:
    that:
    - tls_schedule_files.results | map(attribute='stat.exists') | min
    - tls_schedule_files.results[2].stat.mode == '0600'
    - tls_schedule_files.results[2].stat.pw_name == tls_renew_schedule_user
    fail_msg: Provide the existing Vault password in a user-owned 0600 file outside Git. Confirm the Ansible binary
      and repository paths.
- name: Install renewal service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Renew private-CA Praefect certificates with NLB draining
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      User={{ tls_renew_schedule_user }}
      WorkingDirectory={{ (playbook_dir | dirname) }}
      Environment=ANSIBLE_CONFIG={{ (playbook_dir | dirname) }}/ansible.cfg
      Environment=AWS_PAGER=
      RuntimeDirectory=gitlab-tls-renewal
      RuntimeDirectoryMode=0700
      UMask=0077
      ExecStart=/usr/bin/flock -n /run/gitlab-tls-renewal/renew.lock {{ ((ansible_playbook_python | dirname) ~ '/ansible-playbook') }} playbooks/renew_tls.yml --limit praefect --vault-password-file {{ tls_renew_schedule_vault_password_file }} -e '{"tls_renew_maintenance_window":false,"tls_renew_force":false}'
      TimeoutStartSec=2h
    dest: /etc/systemd/system/gitlab-tls-renewal.service
    owner: root
    group: root
    mode: '0644'
  register: tls_schedule_service
- name: Install renewal timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Check Praefect certificates daily for 30-day renewal

      [Timer]
      OnCalendar=*-*-* 03:00:00
      RandomizedDelaySec=15m
      Persistent=true
      Unit=gitlab-tls-renewal.service

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/gitlab-tls-renewal.timer
    owner: root
    group: root
    mode: '0644'
  register: tls_schedule_timer
- name: Enable daily certificate-age checks without running renewal immediately
  ansible.builtin.systemd_service:
    name: gitlab-tls-renewal.timer
    daemon_reload: true
    enabled: true
    state: '{{ ''restarted'' if (tls_schedule_service is changed or tls_schedule_timer is changed) else ''started''
      }}'
