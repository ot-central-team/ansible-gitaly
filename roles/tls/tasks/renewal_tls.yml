---
# All certificate renewal, validation, activation and rollback steps live here.
- name: Renew node certificates with the existing key and CA
  vars:
    tls_renew_inspection_python: |
      """Read-only certificate/key checks; private key bytes never leave this process."""
      import argparse
      import datetime as dt
      import json
      import ssl
      import socket
      from pathlib import Path
      from cryptography import x509
      from cryptography.hazmat.primitives import serialization, hashes
      from cryptography.x509.oid import ExtendedKeyUsageOID

      p = argparse.ArgumentParser()
      p.add_argument('--certificate', required=True)
      p.add_argument('--key', required=True)
      p.add_argument('--ca', required=True)
      p.add_argument('--names', required=True)
      p.add_argument('--interval', type=int, default=30)
      p.add_argument('--remaining', type=int, default=30)
      p.add_argument('--lifetime', type=int, default=365)
      p.add_argument('--candidate', action='store_true')
      p.add_argument('--port', type=int)
      a = p.parse_args()
      now = dt.datetime.now(dt.timezone.utc)
      def utc(cert, name):
          if hasattr(cert, name + '_utc'):
              return getattr(cert, name + '_utc')
          return getattr(cert, name).replace(tzinfo=dt.timezone.utc)
      cert = x509.load_pem_x509_certificate(Path(a.certificate).read_bytes())
      ca = x509.load_pem_x509_certificate(Path(a.ca).read_bytes())
      key = serialization.load_pem_private_key(Path(a.key).read_bytes(), password=None)
      def pub(k):
          return k.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
      if pub(cert.public_key()) != pub(key.public_key()):
          raise SystemExit('Certificate does not match the existing private key; restore matching material.')
      if not ca.extensions.get_extension_for_class(x509.BasicConstraints).value.ca:
          raise SystemExit('The configured CA certificate is not a CA.')
      if utc(ca, 'not_valid_before') > now or utc(ca, 'not_valid_after') <= now + dt.timedelta(days=a.lifetime):
          raise SystemExit('CA is not valid for the requested leaf lifetime. Plan CA rotation separately.')
      try:
          names = set(cert.extensions.get_extension_for_class(x509.SubjectAlternativeName).value.get_values_for_type(x509.DNSName))
      except x509.ExtensionNotFound:
          names = set()
      wanted = set(json.loads(a.names))
      due = (names != wanted or utc(cert, 'not_valid_before') > now
             or now >= utc(cert, 'not_valid_before') + dt.timedelta(days=a.interval)
             or utc(cert, 'not_valid_after') <= now + dt.timedelta(days=a.remaining))
      if a.candidate:
          if names != wanted or not (utc(cert, 'not_valid_before') <= now < utc(cert, 'not_valid_after')):
              raise SystemExit('Candidate validity or SANs do not match.')
          if utc(cert, 'not_valid_after') < now + dt.timedelta(days=a.lifetime, minutes=-10):
              raise SystemExit('Candidate lifetime is shorter than requested.')
          if ExtendedKeyUsageOID.SERVER_AUTH not in cert.extensions.get_extension_for_class(x509.ExtendedKeyUsage).value:
              raise SystemExit('Candidate is not a server certificate.')
      if a.port:
          ctx = ssl.create_default_context(cafile=a.ca)
          ctx.set_alpn_protocols(['h2'])
          with socket.create_connection(('127.0.0.1', a.port), timeout=10) as sock:
              with ctx.wrap_socket(sock, server_hostname=next(iter(sorted(wanted)))) as conn:
                  live = x509.load_der_x509_certificate(conn.getpeercert(binary_form=True))
                  if live.fingerprint(hashes.SHA256()) != cert.fingerprint(hashes.SHA256()):
                      raise SystemExit('Service has not loaded the staged certificate.')
                  if conn.selected_alpn_protocol() != 'h2':
                      raise SystemExit('Service did not negotiate h2.')
      print(json.dumps({'due': due, 'dns_names': sorted(names)}))
  block:
  - name: Validate renewal scope and policy
    ansible.builtin.assert:
      that:
      - not ansible_check_mode
      - ansible_play_batch | length == 1
      - (inventory_hostname in groups.get('praefect', [])) != (inventory_hostname in groups.get('gitaly', []))
      - groups.get('bastion', []) | length == 1
      - groups.get('praefect', []) | length > 0
      - inventory_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - tls_extra_dns_names is sequence and tls_extra_dns_names is not string
      - tls_leaf_validity_days | int > tls_renew_interval_days | int
      - tls_renew_interval_days | int > 0
      - tls_renew_interval_days | int < tls_leaf_validity_days | int
      - tls_leaf_validity_days | int <= 825
      fail_msg: Renewal requires serial 1, an existing cluster and valid lifetimes; check mode is not supported.
  - name: Select service and require its configured certificate paths
    ansible.builtin.set_fact:
      tls_renew_service: '{{ ''praefect'' if inventory_hostname in groups.get(''praefect'', []) else ''gitaly''
        }}'
      tls_renew_port: '{{ praefect_tls_port if inventory_hostname in groups.get(''praefect'', []) else gitaly_tls_port }}'
      tls_renew_names: '{{ ([inventory_hostname] + tls_extra_dns_names) | unique | list }}'
      tls_renew_drain: '{{ inventory_hostname in groups.get(''praefect'', []) and not (tls_renew_maintenance_window
        | bool) }}'
  - name: Reject aliases that are not DNS names
    ansible.builtin.assert:
      that:
      - item is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
    loop: '{{ tls_renew_names }}'
  - name: Require CA signing credentials
    ansible.builtin.assert:
      that:
      - hostvars[groups['bastion'][0]]['tls_ca_privatekey_passphrase'] is defined
    no_log: true
  - name: Verify configured service uses the managed private-CA files
    ansible.builtin.command:
      argv:
      - /usr/bin/python3
      - -c
      - |
        import sys, tomllib
        with open('/var/opt/gitlab/' + sys.argv[1] + '/config.toml', 'rb') as f:
            t = tomllib.load(f)['tls']
        if t['certificate_path'] != sys.argv[2] or t['key_path'] != sys.argv[3]:
            raise SystemExit('Service certificate paths differ from managed TLS files')
      - '{{ tls_renew_service }}'
      - '{{ tls_leaf_certificate_path }}'
      - '{{ tls_leaf_privatekey_path }}'
    changed_when: false
    no_log: true
  - name: Inspect current certificate without modifying keys or certificates
    changed_when: false
    register: tls_renew_inspect
    ansible.builtin.command:
      argv:
      - /usr/bin/python3
      - -c
      - '{{ tls_renew_inspection_python }}'
      - --certificate
      - '{{ tls_leaf_certificate_path }}'
      - --key
      - '{{ tls_leaf_privatekey_path }}'
      - --ca
      - '{{ (tls_trusted_certificates_directory + ''/repo-data-internal-ca.crt'') }}'
      - --names
      - '{{ tls_renew_names | to_json }}'
      - --interval
      - '{{ tls_renew_interval_days | int }}'
      - --remaining
      - '{{ tls_renew_interval_days | int }}'
      - --lifetime
      - '{{ tls_leaf_validity_days | int }}'
  - name: Renew only when names changed, age reached interval, expiry approaches or explicitly forced
    when: (tls_renew_inspect.stdout | from_json).due or tls_renew_force | bool
    block:
    - name: Require a maintenance window or configured Praefect NLB draining
      ansible.builtin.assert:
        that:
        - tls_renew_maintenance_window | bool or (tls_renew_service == 'praefect' and tls_renew_nlb_target_group_arn
          | length > 0 and tls_renew_nlb_target_id | length > 0)
        fail_msg: For Praefect configure NLB ARN and per-host target IDs, or explicitly set tls_renew_maintenance_window=true
          for a maintenance window. Gitaly renewal currently requires a maintenance window.
    - name: Check cluster health before planned renewal
      ansible.builtin.command:
        argv:
        - gitlab-ctl
        - praefect
        - check
      delegate_to: '{{ inventory_hostname if tls_renew_service == ''praefect'' else groups[''praefect''][0] }}'
      changed_when: false
    - name: Read CA fingerprint on signing bastion
      ansible.builtin.stat:
        path: '{{ tls_ca_certificate_path }}'
        checksum_algorithm: sha256
      delegate_to: '{{ groups[''bastion''][0] }}'
      register: tls_renew_signing_ca
    - name: Read trusted CA fingerprint on node
      ansible.builtin.stat:
        path: '{{ tls_trusted_certificates_directory }}/repo-data-internal-ca.crt'
        checksum_algorithm: sha256
      register: tls_renew_trusted_ca
    - name: Refuse implicit CA rotation
      ansible.builtin.assert:
        that:
        - tls_renew_signing_ca.stat.checksum == tls_renew_trusted_ca.stat.checksum
    - name: Inspect NLB targets before signing
      ansible.builtin.command:
        argv:
        - aws
        - elbv2
        - describe-target-health
        - --region
        - "{{ tls_renew_nlb_target_group_arn.split(':')[3] }}"
        - --target-group-arn
        - '{{ tls_renew_nlb_target_group_arn }}'
        - --output
        - json
      environment:
        AWS_PAGER: ''
      delegate_to: localhost
      become: false
      register: tls_renew_targets
      changed_when: false
      when: tls_renew_drain | bool
    - name: Require this target and at least one other healthy target
      ansible.builtin.assert:
        that:
        - (tls_renew_targets.stdout | from_json).TargetHealthDescriptions | selectattr('Target.Id', 'equalto', tls_renew_nlb_target_id)
          | selectattr('Target.Port', 'equalto', tls_renew_port | int) | selectattr('TargetHealth.State', 'equalto',
          'healthy') | list | length == 1
        - (tls_renew_targets.stdout | from_json).TargetHealthDescriptions | rejectattr('Target.Id', 'equalto', tls_renew_nlb_target_id)
          | selectattr('TargetHealth.State', 'equalto', 'healthy') | list | length > 0
        fail_msg: Refusing to drain the last healthy target or a target not registered and healthy.
      when: tls_renew_drain | bool
    - name: Create temporary node signing workspace
      ansible.builtin.tempfile:
        state: directory
        path: '{{ tls_leaf_directory }}'
        prefix: renewal-
      register: tls_renew_workspace
    - name: Issue and activate renewed certificate
      block:
      - name: Create new CSR using the existing private key
        community.crypto.openssl_csr:
          path: '{{ tls_renew_workspace.path }}/server.csr'
          privatekey_path: '{{ tls_leaf_privatekey_path }}'
          common_name: '{{ inventory_hostname }}'
          subject_alt_name: '{{ tls_renew_names | map(''regex_replace'', ''^'', ''DNS:'') | list }}'
          key_usage:
          - digitalSignature
          - keyEncipherment
          extended_key_usage:
          - serverAuth
          owner: root
          group: root
          mode: '0600'
      - name: Read public CSR for signing
        ansible.builtin.slurp:
          src: '{{ tls_renew_workspace.path }}/server.csr'
        register: tls_renew_csr
      - name: Create temporary signing workspace on bastion
        ansible.builtin.tempfile:
          state: directory
          path: '{{ tls_ca_directory }}'
          prefix: renewal-
        delegate_to: '{{ groups[''bastion''][0] }}'
        register: tls_renew_ca_workspace
      - name: Sign CSR using the existing bastion CA
        community.crypto.x509_certificate:
          path: '{{ tls_renew_ca_workspace.path }}/server.crt'
          csr_content: '{{ tls_renew_csr.content | b64decode }}'
          ownca_path: '{{ tls_ca_certificate_path }}'
          ownca_privatekey_path: '{{ tls_ca_privatekey_path }}'
          ownca_privatekey_passphrase: '{{ hostvars[groups[''bastion''][0]][''tls_ca_privatekey_passphrase''] }}'
          provider: ownca
          ownca_not_before: -5m
          ownca_not_after: +{{ tls_leaf_validity_days }}d
          ownca_digest: sha256
          mode: '0644'
        delegate_to: '{{ groups[''bastion''][0] }}'
        no_log: true
      - name: Read signed public certificate
        ansible.builtin.slurp:
          src: '{{ tls_renew_ca_workspace.path }}/server.crt'
        delegate_to: '{{ groups[''bastion''][0] }}'
        register: tls_renew_signed
      - name: Stage candidate certificate on the node
        ansible.builtin.copy:
          content: '{{ tls_renew_signed.content | b64decode }}'
          dest: '{{ tls_renew_workspace.path }}/server.crt'
          owner: root
          group: git
          mode: '0640'
      - name: Verify candidate signature against the existing trusted CA
        ansible.builtin.command:
          argv:
          - openssl
          - verify
          - -purpose
          - sslserver
          - -CAfile
          - '{{ tls_trusted_certificates_directory }}/repo-data-internal-ca.crt'
          - '{{ tls_renew_workspace.path }}/server.crt'
        changed_when: false
      - name: Validate candidate names, key match, validity and CA lifetime
        changed_when: false
        ansible.builtin.command:
          argv:
          - /usr/bin/python3
          - -c
          - '{{ tls_renew_inspection_python }}'
          - --candidate
          - --certificate
          - '{{ (tls_renew_workspace.path + ''/server.crt'') }}'
          - --key
          - '{{ tls_leaf_privatekey_path }}'
          - --ca
          - '{{ (tls_trusted_certificates_directory + ''/repo-data-internal-ca.crt'') }}'
          - --names
          - '{{ tls_renew_names | to_json }}'
          - --lifetime
          - '{{ tls_leaf_validity_days | int }}'
      - name: Activate candidate with rollback on failure
        block:
        - name: Back up the current certificate before any activation
          ansible.builtin.copy:
            src: '{{ tls_leaf_certificate_path }}'
            dest: '{{ tls_leaf_certificate_path }}.pre-renewal'
            remote_src: true
            owner: root
            group: git
            mode: '0640'
        - name: Drain, activate and check this node
          block:
          - name: Deregister this Praefect target from NLB
            ansible.builtin.command:
              argv:
              - aws
              - elbv2
              - deregister-targets
              - --region
              - "{{ tls_renew_nlb_target_group_arn.split(':')[3] }}"
              - --target-group-arn
              - '{{ tls_renew_nlb_target_group_arn }}'
              - --targets
              - Id={{ tls_renew_nlb_target_id }},Port={{ tls_renew_port }}
            delegate_to: localhost
            become: false
            when: tls_renew_drain | bool
          - name: Wait for the NLB deregistration delay to finish
            ansible.builtin.command:
              argv:
              - aws
              - elbv2
              - wait
              - target-deregistered
              - --region
              - "{{ tls_renew_nlb_target_group_arn.split(':')[3] }}"
              - --target-group-arn
              - '{{ tls_renew_nlb_target_group_arn }}'
              - --targets
              - Id={{ tls_renew_nlb_target_id }},Port={{ tls_renew_port }}
            delegate_to: localhost
            become: false
            changed_when: false
            when: tls_renew_drain | bool
          - name: Atomically install the validated certificate
            ansible.builtin.copy:
              src: '{{ tls_renew_workspace.path }}/server.crt'
              dest: '{{ tls_leaf_certificate_path }}'
              remote_src: true
              owner: root
              group: git
              mode: '0640'
          - name: Restart only this node's service to load the certificate
            ansible.builtin.command:
              argv:
              - gitlab-ctl
              - restart
              - '{{ tls_renew_service }}'
          - name: Check activated TLS and cluster health
            block:
            - name: Confirm the running service presents the installed certificate over TLS with h2
              register: tls_renew_live_check
              until: tls_renew_live_check is succeeded
              retries: 6
              delay: 5
              changed_when: false
              ansible.builtin.command:
                argv:
                - /usr/bin/python3
                - -c
                - '{{ tls_renew_inspection_python }}'
                - --certificate
                - '{{ tls_leaf_certificate_path }}'
                - --key
                - '{{ tls_leaf_privatekey_path }}'
                - --ca
                - '{{ (tls_trusted_certificates_directory + ''/repo-data-internal-ca.crt'') }}'
                - --names
                - '{{ tls_renew_names | to_json }}'
                - --lifetime
                - '{{ tls_leaf_validity_days | int }}'
                - --port
                - '{{ tls_renew_port | int }}'
            - name: Confirm Praefect database and Gitaly health after activation
              ansible.builtin.command:
                argv:
                - gitlab-ctl
                - praefect
                - check
              delegate_to: '{{ inventory_hostname if tls_renew_service == ''praefect'' else groups[''praefect''][0]
                }}'
              register: tls_renew_cluster_check
              until: tls_renew_cluster_check.rc == 0
              retries: 3
              delay: 5
              changed_when: false
          - name: Return healthy Praefect target to NLB
            when: tls_renew_drain | bool
            block:
            - name: Register the verified Praefect target
              ansible.builtin.command:
                argv:
                - aws
                - elbv2
                - register-targets
                - --region
                - "{{ tls_renew_nlb_target_group_arn.split(':')[3] }}"
                - --target-group-arn
                - '{{ tls_renew_nlb_target_group_arn }}'
                - --targets
                - Id={{ tls_renew_nlb_target_id }},Port={{ tls_renew_port }}
              delegate_to: localhost
              become: false
            - name: Wait for NLB to mark the target healthy
              ansible.builtin.command:
                argv:
                - aws
                - elbv2
                - wait
                - target-in-service
                - --region
                - "{{ tls_renew_nlb_target_group_arn.split(':')[3] }}"
                - --target-group-arn
                - '{{ tls_renew_nlb_target_group_arn }}'
                - --targets
                - Id={{ tls_renew_nlb_target_id }},Port={{ tls_renew_port }}
              delegate_to: localhost
              become: false
              changed_when: false
          rescue:
          - name: Restore the previous certificate
            ansible.builtin.copy:
              src: '{{ tls_leaf_certificate_path }}.pre-renewal'
              dest: '{{ tls_leaf_certificate_path }}'
              remote_src: true
              owner: root
              group: git
              mode: '0640'
          - name: Restart service with restored certificate
            ansible.builtin.command:
              argv:
              - gitlab-ctl
              - restart
              - '{{ tls_renew_service }}'
          - name: Use previous certificate names for rollback health verification
            ansible.builtin.set_fact:
              tls_renew_names: '{{ (tls_renew_inspect.stdout | from_json).dns_names }}'
          - name: Verify rollback before returning target to traffic
            block:
            - name: Confirm the running service presents the installed certificate over TLS with h2
              register: tls_renew_live_check
              until: tls_renew_live_check is succeeded
              retries: 6
              delay: 5
              changed_when: false
              ansible.builtin.command:
                argv:
                - /usr/bin/python3
                - -c
                - '{{ tls_renew_inspection_python }}'
                - --certificate
                - '{{ tls_leaf_certificate_path }}'
                - --key
                - '{{ tls_leaf_privatekey_path }}'
                - --ca
                - '{{ (tls_trusted_certificates_directory + ''/repo-data-internal-ca.crt'') }}'
                - --names
                - '{{ tls_renew_names | to_json }}'
                - --lifetime
                - '{{ tls_leaf_validity_days | int }}'
                - --port
                - '{{ tls_renew_port | int }}'
            - name: Confirm Praefect database and Gitaly health after activation
              ansible.builtin.command:
                argv:
                - gitlab-ctl
                - praefect
                - check
              delegate_to: '{{ inventory_hostname if tls_renew_service == ''praefect'' else groups[''praefect''][0]
                }}'
              register: tls_renew_cluster_check
              until: tls_renew_cluster_check.rc == 0
              retries: 3
              delay: 5
              changed_when: false
          - name: Return restored healthy target to NLB
            when: tls_renew_drain | bool
            block:
            - name: Register the verified Praefect target
              ansible.builtin.command:
                argv:
                - aws
                - elbv2
                - register-targets
                - --region
                - "{{ tls_renew_nlb_target_group_arn.split(':')[3] }}"
                - --target-group-arn
                - '{{ tls_renew_nlb_target_group_arn }}'
                - --targets
                - Id={{ tls_renew_nlb_target_id }},Port={{ tls_renew_port }}
              delegate_to: localhost
              become: false
            - name: Wait for NLB to mark the target healthy
              ansible.builtin.command:
                argv:
                - aws
                - elbv2
                - wait
                - target-in-service
                - --region
                - "{{ tls_renew_nlb_target_group_arn.split(':')[3] }}"
                - --target-group-arn
                - '{{ tls_renew_nlb_target_group_arn }}'
                - --targets
                - Id={{ tls_renew_nlb_target_id }},Port={{ tls_renew_port }}
              delegate_to: localhost
              become: false
              changed_when: false
          - name: Stop rollout after renewal failure even when rollback succeeded
            ansible.builtin.fail:
              msg: Renewal failed; the old certificate was restored and checked. Resolve the error before retrying.
                No further nodes will be renewed.
      - name: Archive activated CSR on the bastion
        ansible.builtin.copy:
          content: '{{ tls_renew_csr.content | b64decode }}'
          dest: '{{ tls_ca_directory }}/requests/{{ inventory_hostname }}.csr'
          owner: root
          group: root
          mode: '0600'
          backup: true
        delegate_to: '{{ groups[''bastion''][0] }}'
      - name: Archive activated certificate on the bastion
        ansible.builtin.copy:
          content: '{{ tls_renew_signed.content | b64decode }}'
          dest: '{{ tls_ca_directory }}/issued-{{ inventory_hostname }}.crt'
          owner: root
          group: root
          mode: '0644'
          backup: true
        delegate_to: '{{ groups[''bastion''][0] }}'
      - name: Save the updated CSR on the node
        ansible.builtin.copy:
          src: '{{ tls_renew_workspace.path }}/server.csr'
          dest: '{{ tls_leaf_csr_path }}'
          remote_src: true
          owner: root
          group: root
          mode: '0600'
          backup: true
      always:
      - name: Remove temporary public signing material from node
        ansible.builtin.file:
          path: '{{ tls_renew_workspace.path }}'
          state: absent
      - name: Remove temporary public signing material from bastion
        ansible.builtin.file:
          path: '{{ tls_renew_ca_workspace.path }}'
          state: absent
        delegate_to: '{{ groups[''bastion''][0] }}'
        when: tls_renew_ca_workspace.path is defined
