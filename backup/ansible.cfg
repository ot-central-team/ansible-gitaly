[defaults]
inventory = inventory/lab/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
private_key_file = /home/ubuntu/.ssh/gitaly-lab.pem

[ssh_connection]
# Trust new hosts on first connection; reject changed keys for known hosts.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[privilege_escalation]
become = True
become_method = sudo
