---
- name: Install NVMe identification and filesystem tools
  ansible.builtin.apt:
    name:
      - nvme-cli
      - util-linux
      - e2fsprogs
    state: present
    update_cache: true

- name: Identify and validate the EBS data disk by its AWS attachment name
  ansible.builtin.script:
    cmd: >-
      discover_ebs_device.py
      {{ gitaly_data_attachment_name | quote }}
      {{ gitaly_data_mountpoint | quote }}
      {{ gitaly_data_filesystem | quote }}
      {{ (gitaly_format_data_disk | bool | ternary('true', 'false')) | quote }}
    executable: /usr/bin/python3
  register: gitaly_data_device_lookup
  changed_when: false
  check_mode: false

- name: Store the verified data disk selection
  ansible.builtin.set_fact:
    gitaly_data_disk: "{{ gitaly_data_device_lookup.stdout | from_json }}"

- name: Create ext4 filesystem on this host's data volume
  community.general.filesystem:
    dev: "{{ gitaly_data_disk.device }}"
    fstype: "{{ gitaly_data_filesystem }}"
    force: false
  when:
    - gitaly_format_data_disk | bool
    - gitaly_data_disk.blank | bool

- name: Read the filesystem UUID
  ansible.builtin.command:
    argv:
      - blkid
      - -o
      - value
      - -s
      - UUID
      - "{{ gitaly_data_disk.device }}"
  register: gitaly_data_uuid_result
  changed_when: false

- name: Create the repository data mountpoint
  ansible.builtin.file:
    path: "{{ gitaly_data_mountpoint }}"
    state: directory
    mode: '0755'

- name: Mount the repository volume by UUID and persist it in fstab
  ansible.posix.mount:
    src: "UUID={{ gitaly_data_uuid_result.stdout | trim }}"
    path: "{{ gitaly_data_mountpoint }}"
    fstype: "{{ gitaly_data_filesystem }}"
    opts: defaults
    dump: '0'
    passno: '2'
    state: mounted

- name: Reload systemd mount units after fstab update
  ansible.builtin.systemd_service:
    daemon_reload: true
