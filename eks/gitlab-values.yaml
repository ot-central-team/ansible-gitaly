# GitLab chart 10.4.1 / GitLab EE 19.4.1. Read ../setup.md first.
# Copy to eks/local/ and replace REPLACE_* there. No passwords in this file.
global:
  edition: ee
  hpa:
    apiVersion: autoscaling/v2
  pdb:
    apiVersion: policy/v1
  batch:
    cronJob:
      apiVersion: batch/v1
  nodeSelector:
    workload: gitlab-app
  hosts:
    domain: opstree.dev
    https: true
    gitlab:
      name: gitlab.opstree.dev
  # Use the existing AWS ALB controller and our separate Ingress manifest.
  ingress:
    enabled: false
    configureCertmanager: false
    tls:
      enabled: false
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureEnvoy: false
    configureCertmanager: false
  gitaly:
    enabled: false
    external:
      - name: default
        hostname: haproxy.tyagi.fun
        port: 443
        tlsEnabled: true
    authToken:
      secret: praefect-external-token
      key: token
  praefect:
    enabled: false
  shell:
    authToken:
      secret: gitlab-shell-shared
      key: secret
  psql:
    host: REPLACE_RAILS_RDS_ENDPOINT
    port: 5432
    username: gitlab
    database: gitlabhq_production
    password:
      secret: gitlab-db-password
      key: password
  redis:
    host: REPLACE_REDIS_PRIMARY_ENDPOINT
    port: 6379
    scheme: rediss
    auth:
      enabled: true
      secret: gitlab-redis-password
      key: password
  certificates:
    customCAs:
      - secret: aws-rds-ca
  extraEnv:
    PGSSLMODE: verify-full
    PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
    AWS_REGION: ap-south-1
    AWS_DEFAULT_REGION: ap-south-1
    AWS_STS_REGIONAL_ENDPOINTS: regional
    AWS_EC2_METADATA_DISABLED: "true"
  # ALB terminates public TLS. ALB -> Workhorse uses HTTP in the private VPC.
  workhorse:
    tls:
      enabled: false
  kas:
    enabled: false
  pages:
    enabled: false
  registry:
    enabled: false
  appConfig:
    defaultProjectsFeatures:
      containerRegistry: false
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-rails-storage
        key: connection
    artifacts:
      bucket: REPLACE_BUCKET_PREFIX-artifacts
    lfs:
      bucket: REPLACE_BUCKET_PREFIX-lfs
    uploads:
      bucket: REPLACE_BUCKET_PREFIX-uploads
    packages:
      bucket: REPLACE_BUCKET_PREFIX-packages
    externalDiffs:
      enabled: true
      bucket: REPLACE_BUCKET_PREFIX-mr-diffs
    terraformState:
      enabled: true
      bucket: REPLACE_BUCKET_PREFIX-terraform-state
    ciSecureFiles:
      enabled: true
      bucket: REPLACE_BUCKET_PREFIX-ci-secure-files
    dependencyProxy:
      enabled: false
    agentPlanContent:
      enabled: false
    ciCatalogBundles:
      enabled: false
    backups:
      bucket: REPLACE_BUCKET_PREFIX-backups
      tmpBucket: REPLACE_BUCKET_PREFIX-restore-tmp
  # SES SMTP credentials are different from AWS access keys and from IRSA.
  smtp:
    enabled: true
    address: email-smtp.ap-south-1.amazonaws.com
    port: 587
    user_name_secret:
      secret: gitlab-smtp
      key: username
    password:
      secret: gitlab-smtp
      key: password
    domain: gitlab.opstree.dev
    authentication: login
    starttls_auto: true
    openssl_verify_mode: peer
  email:
    from: gitlab@opstree.dev
    reply_to: noreply@opstree.dev

installCertmanager: false
nginx-ingress:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false
registry:
  enabled: false

gitlab:
  webservice:
    minReplicas: 4
    maxReplicas: 8
    workerProcesses: 4
    hpa:
      cpu:
        targetType: Utilization
        targetAverageUtilization: 75
    maxUnavailable: 1
    resources:
      requests:
        cpu: "4"
        memory: 5Gi
      limits:
        memory: 7Gi
    service:
      type: ClusterIP
    serviceAccount:
      enabled: true
      create: false
      name: gitlab-rails
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: webservice
            release: gitlab
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: webservice
            release: gitlab
  sidekiq:
    minReplicas: 8
    maxReplicas: 12
    concurrency: 20
    hpa:
      cpu:
        targetType: Utilization
        targetAverageUtilization: 75
    maxUnavailable: 1
    resources:
      requests:
        cpu: 900m
        memory: 2Gi
      limits:
        memory: 4Gi
    serviceAccount:
      enabled: true
      create: false
      name: gitlab-rails
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: sidekiq
            release: gitlab
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: sidekiq
            release: gitlab
  migrations:
    serviceAccount:
      enabled: true
      create: false
      name: gitlab-rails
  toolbox:
    replicas: 1
    serviceAccount:
      enabled: true
      create: false
      name: gitlab-toolbox
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 4Gi
    persistence:
      enabled: true
      storageClass: gitlab-gp3
      size: 200Gi
    backups:
      objectStorage:
        backend: s3
      cron:
        # Enable only after the manual backup/restore test in setup.md.
        enabled: false
        schedule: "0 20 * * *" # UTC: 01:30 IST
        concurrencyPolicy: Forbid
        extraArgs: --s3tool awscli
        persistence:
          enabled: true
          storageClass: gitlab-gp3
          size: 200Gi
  gitlab-shell:
    enabled: false # HTTPS Git only; ALB cannot carry SSH.
