# Separate release gitlab-runner, namespace gitlab-runner; chart 0.93.0.
gitlabUrl: https://gitlab.opstree.dev
replicas: 1
concurrent: 10 # CI jobs, NOT the number of active GitLab users.
checkInterval: 3
rbac:
  create: true
  clusterWideAccess: false
serviceAccount:
  create: true
  name: gitlab-runner-manager
nodeSelector:
  workload: gitlab-app
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi
runners:
  secret: gitlab-runner-auth
  config: |
    [[runners]]
      executor = "kubernetes"
      [runners.kubernetes]
        namespace = "gitlab-runner"
        image = "alpine:3.22"
        privileged = false
        allow_privilege_escalation = false
        service_account = "gitlab-job"
        automount_service_account_token = false
        cpu_request = "500m"
        cpu_limit = "2"
        memory_request = "512Mi"
        memory_limit = "2Gi"
        helper_cpu_request = "100m"
        helper_memory_request = "128Mi"
        helper_memory_limit = "512Mi"
        poll_timeout = 600
        [runners.kubernetes.node_selector]
          workload = "gitlab-ci"
        [runners.kubernetes.node_tolerations]
          "workload=gitlab-ci" = "NoSchedule"
    # Distributed Runner cache is intentionally not enabled; artifacts still use S3.
